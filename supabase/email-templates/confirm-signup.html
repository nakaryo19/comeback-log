<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f6f8;padding:24px 0;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#ffffff;border-radius:12px;padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;">
        <tr>
          <td style="font-size:18px;font-weight:700;color:#1a1a1e;padding-bottom:4px;">
            挽回ログ
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;color:#7a7a85;padding-bottom:24px;">
            もう一度、自分のペースで。
          </td>
        </tr>
        <tr>
          <td style="font-size:16px;font-weight:600;color:#1a1a1e;padding-bottom:12px;">
            メールアドレスの確認
          </td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:22px;color:#41414b;padding-bottom:24px;">
            挽回ログへのご登録ありがとうございます。<br />
            下のボタンを開くと、登録が完了します。
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <a
              href="{{ .ConfirmationURL }}"
              style="display:inline-block;background-color:#5b5bd6;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:14px 32px;border-radius:8px;"
            >
              メールアドレスを確認する
            </a>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:21px;color:#7a7a85;padding-bottom:16px;">
            このリンクは24時間で無効になります。期限が切れた場合は、アプリの登録画面から確認メールを再送してください。
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:21px;color:#7a7a85;border-top:1px solid #e7e7ec;padding-top:16px;">
            心当たりがない場合は、このメールを破棄してください。
            <strong style="color:#41414b;">リンクを開かないかぎり、アカウントは有効になりません。</strong>
          </td>
        </tr>
        <tr>
          <td style="font-size:12px;line-height:19px;color:#9a9aa5;padding-top:16px;">
            ボタンが開けない場合は、次のURLをブラウザに貼り付けてください。<br />
            <span style="word-break:break-all;">{{ .ConfirmationURL }}</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
